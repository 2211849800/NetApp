# fly.toml app configuration file generated for netapp-app-2026 on 2026-09-25T22:13:12+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'netapp-app-2026'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_URL = "https://netapp-app-2026.fly.dev"
  DB_CONNECTION = "sqlite"
  DB_DATABASE = "/var/www/storage/database/database.sqlite"
  SESSION_DRIVER = "file"
  CACHE_STORE = "file"
  QUEUE_CONNECTION = "sync"
  LOG_CHANNEL = "stderr"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[mounts]
  source = "storage_vol"
  destination = "/var/www/storage"

[[vm]]
  memory = '1gb'
  cpus = 1
